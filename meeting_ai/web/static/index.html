<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: ให้เนื้อหาเลยเข้าไปถึงขอบจอ iPhone ที่มี notch/home indicator
     แถบควบคุมลอยด้านล่างใช้ env(safe-area-inset-bottom) เว้นระยะจาก home indicator เอง -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meeting_ai — บันทึกและสรุปการประชุม</title>
<!-- ฝัง favicon เป็น data URI ไปเลย เบราว์เซอร์จะได้ไม่ยิงหา /favicon.ico แล้วได้ 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5856d6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#5e5ce6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="meeting_ai">
<link rel="apple-touch-icon" href="/static/icon.svg">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🎙️</span>
    <span>meeting_ai</span>
  </div>
  <div id="stats" class="stats"></div>
  <!-- จอแคบ: ปุ่มกลมตัวอักษรเดียวแทนกล่องบัญชีทั้งก้อน (อีเมล + ปุ่มแอดมิน 3 ปุ่ม)
       ซึ่งบนจอ 390px ทำให้ปุ่มตัดเป็นสองบรรทัดและดัน topbar สูงเกือบ 80px
       กดแล้ว #userbox เดิมจะถูก CSS ย้ายลงมาเป็นแผ่นล่างจอ ปุ่มยังเป็นชุดเดิมทุกปุ่ม -->
  <button id="btn-account" class="acct" type="button" hidden aria-label="บัญชีและการตั้งค่า"></button>
  <div id="userbox" class="userbox" hidden></div>
  <!-- คู่มืออยู่บน topbar ไม่ใช่ในกล่องบัญชี เพราะคนที่ต้องการมันที่สุดคือคนที่ยัง
       ไม่ได้ล็อกอิน/เพิ่งเปิดครั้งแรก ซึ่งกล่องบัญชีว่างเปล่าหรือซ่อนอยู่ (BACKLOG #90) -->
  <button id="btn-help" class="btn btn-icon" type="button"
          aria-label="คู่มือการใช้งาน" title="คู่มือการใช้งาน">?</button>
  <button id="btn-new" class="btn btn-primary">+ ประชุมใหม่</button>
</header>

<div id="banner" class="banner" hidden></div>

<!-- แถบนำทางของมือถือ — เดสก์ท็อปไม่ใช้ เพราะ sidebar กับ panel เห็นพร้อมกันอยู่แล้ว
     บนจอแคบเราโชว์ทีละหน้า (list / ประชุมใหม่ / เครื่องประมวลผล / รายละเอียด) แถบนี้จึงเป็น
     ทางเดียวที่จะย้อนกลับได้ ปุ่มขวาเปลี่ยนตามหน้า (เช่น ⋯ ของหน้ารายละเอียด) -->
<div id="mobilebar" class="mobilebar" hidden>
  <button id="mb-back" class="mb-icon" type="button" aria-label="ย้อนกลับ">‹</button>
  <span id="mb-title" class="mb-title"></span>
  <button id="mb-action" class="mb-icon" type="button" hidden aria-label="เมนู">⋯</button>
</div>

<!-- ม่านของ action sheet — ตัวแผ่นคือ .detail-actions เดิมที่ถูก CSS ย้ายมาอยู่ล่างจอ
     (ไม่ได้ทำปุ่มชุดใหม่ ตัวจัดการเหตุการณ์จึงเป็นของเดิมทั้งหมด ไม่มีทางหลุดกัน) -->
<div id="sheet-scrim" class="sheet-scrim" hidden></div>

<main class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="ค้นหาในชื่อ สรุป และบทถอดเสียง…" autocomplete="off">
    </div>
    <!-- สองอันนี้โผล่เฉพาะจอแคบ (ดู style.css) — เดสก์ท็อปใช้ปุ่มบน topbar กับกล่อง
         เครื่องประมวลผลที่กางอยู่แล้ว ไม่ต้องมีซ้ำ -->
    <button id="m-new" class="m-cta" type="button">
      <span class="m-cta-t">เริ่มประชุมใหม่</span>
      <span class="m-cta-s">ส่งบอทเข้าห้อง · อัดสด · อัปโหลดไฟล์</span>
    </button>
    <button id="m-devices" class="m-chip" type="button" hidden>
      <span class="m-chip-dot"></span><span id="m-chip-text"></span>
    </button>
    <div id="jobs" class="jobs"></div>
    <div id="workers" class="workers" hidden></div>
    <!-- หัวข้อของรายการ โผล่เฉพาะจอแคบและเฉพาะตอนมีรายการจริง (ดู renderList) -->
    <div id="m-recent" class="m-section" hidden>ล่าสุด</div>
    <ul id="list" class="list"></ul>
  </aside>
  <section id="panel" class="panel"></section>
</main>

<!-- ---------- หน้าจอ: เข้าสู่ระบบ / สมัคร (โหมด cloud) ---------- -->
<!-- ยืนยันก่อนรับลิงก์แชร์ (BACKLOG #16) — /s/<token> ไม่ตั้งคุกกี้ให้เองอีกแล้ว -->
<template id="tpl-share-confirm">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>มีคนแชร์การประชุมมาให้</h2>
      <p class="muted">กด "เปิด" แล้วเบราว์เซอร์นี้จะจำลิงก์แชร์นี้ไว้ 7 วัน
        และเปิดการประชุมที่แชร์มาให้ทุกครั้งที่เข้าเว็บ — เปิดเฉพาะเมื่อรู้ว่าใครส่งลิงก์นี้มา</p>
      <p id="sc-error" class="notice" hidden></p>
      <button id="sc-open" class="btn btn-primary btn-wide" type="button">เปิดการประชุมที่แชร์มา</button>
      <p class="auth-switch">
        <button id="sc-cancel" class="linkbtn" type="button">ไม่ใช่ตอนนี้ กลับหน้าหลัก</button>
      </p>
    </div>
  </div>
</template>

<template id="tpl-auth">
  <div class="auth-wrap">
    <div class="auth-card">
      <h2 id="a-title">เข้าสู่ระบบ</h2>
      <p id="a-note" class="muted"></p>

      <label class="field">
        <span>อีเมล</span>
        <input id="a-email" type="email" autocomplete="username" placeholder="you@company.com">
      </label>
      <label class="field">
        <span>รหัสผ่าน</span>
        <input id="a-password" type="password" autocomplete="current-password"
               placeholder="อย่างน้อย 8 ตัวอักษร">
      </label>
      <label class="field" id="a-name-wrap" hidden>
        <span>ชื่อที่ให้คนอื่นเห็น</span>
        <input id="a-name" type="text" placeholder="ไม่ใส่ก็ได้">
      </label>
      <label class="field" id="a-invite-wrap" hidden>
        <span>รหัสเชิญ</span>
        <input id="a-invite" type="text" placeholder="ขอจากแอดมินของทีม">
      </label>

      <p id="a-error" class="notice" hidden></p>
      <button id="a-submit" class="btn btn-primary btn-wide" type="button">เข้าสู่ระบบ</button>
      <p class="auth-switch">
        <span id="a-switch-text"></span>
        <button id="a-switch" class="linkbtn" type="button"></button>
      </p>
    </div>
  </div>
</template>

<!-- ---------- หน้าจอ: ประชุมใหม่ ---------- -->
<template id="tpl-new">
  <div class="pane">
    <h2 class="pane-title">ประชุมใหม่</h2>

    <div class="field-row">
      <label class="field">
        <span>ชื่อการประชุม <b class="req">จำเป็น</b></span>
        <input id="f-title" type="text" required aria-required="true"
               placeholder="เช่น ประชุมทีม Product ประจำสัปดาห์">
      </label>
    </div>


    <!-- ตัวเลือกวิธีนำเสียงเข้า — บนจอแคบโชว์ทีละการ์ด (ดู setupCapturePicker ใน app.js)
         จอกว้างยังกางทั้งสามใบเหมือนเดิม เพราะมีที่พอและเทียบกันได้ในตาเดียว -->
    <div id="cap-label" class="field-label">เอาเสียงเข้ามายังไง</div>
    <div id="cap-seg" class="seg" role="tablist" hidden>
      <button class="seg-btn" type="button" role="tab" data-cap="bot">ส่งบอท</button>
      <button class="seg-btn is-on" type="button" role="tab" data-cap="rec">อัดสด</button>
      <button class="seg-btn" type="button" role="tab" data-cap="upload">อัปโหลดไฟล์</button>
    </div>

    <div class="cards">
      <div class="card" data-cap="bot">
        <h3>🤖 เชิญบอทเข้าห้องประชุม</h3>
        <p class="muted">
          Google Meet, Microsoft Teams, Zoom — บอทเข้าไปนั่งฟังแล้วสรุปให้
          ไม่ต้องเปิดเครื่องไว้เอง สั่งจากมือถือก็ได้
        </p>
        <label class="field">
          <span>ลิงก์ห้องประชุม</span>
          <input id="b-url" type="url" placeholder="วางลิงก์ Meet / Teams / Zoom"
                 autocomplete="off" spellcheck="false">
        </label>
        <p id="b-detect" class="hint"></p>
        <div class="field-row">
          <label class="field">
            <span>ชื่อบอทที่แสดงในห้อง</span>
            <input id="b-name" type="text" value="AI Notetaker" maxlength="60">
          </label>
          <label class="field field-sm" id="b-pass-field" hidden>
            <span>รหัสเข้าห้อง (Zoom) — ใส่ไว้ดีกว่า</span>
            <input id="b-pass" type="text" maxlength="40" placeholder="รหัสตัวเลขของห้อง">
          </label>
          <label class="field field-sm">
            <span>อยู่ในห้องไม่เกิน</span>
            <select id="b-max">
              <option value="30">30 นาที</option>
              <option value="60">1 ชั่วโมง</option>
              <option value="120" selected>2 ชั่วโมง</option>
              <option value="240">4 ชั่วโมง</option>
              <option value="480">8 ชั่วโมง</option>
            </select>
          </label>
        </div>
        <button id="btn-bot" class="btn btn-primary btn-wide" type="button">ส่งบอทเข้าห้อง</button>
        <p id="bot-note" class="hint"></p>
      </div>

      <div class="card" id="rec-card" data-cap="rec">
        <h3>⏺️ อัดสดจากเบราว์เซอร์</h3>
        <p class="muted">
          เลือกได้ว่าจะกดอัดเลยแบบไม่ต้องแชร์หน้าจอ หรือดักเสียงจากแท็บให้คมที่สุด
        </p>

        <div class="modes" id="rec-modes">
          <label class="mode">
            <input type="radio" name="recmode" value="room" checked>
            <span class="mode-body">
              <strong>🎙️ ไมค์เดียว — ไม่ต้องแชร์หน้าจอ</strong>
              <small>กดอัดได้ทันที เหมาะกับประชุมในห้อง หรือเปิดลำโพงคุยผ่านมือถือ/แอปอื่น</small>
            </span>
          </label>
          <label class="mode">
            <input type="radio" name="recmode" value="device">
            <span class="mode-body">
              <strong>🎧 ไมค์ + เสียงในเครื่อง — ไม่ต้องแชร์หน้าจอ</strong>
              <small>แยกได้ว่าใครพูด ต้องมีอุปกรณ์วนเสียงกลับ เช่น Stereo Mix หรือ VB-CABLE</small>
            </span>
          </label>
          <label class="mode">
            <input type="radio" name="recmode" value="tab">
            <span class="mode-body">
              <strong>🖥️ แชร์แท็บ</strong>
              <small>เสียงคมสุดสำหรับประชุมในเบราว์เซอร์ แต่ต้องกดเลือกแท็บทุกครั้ง</small>
            </span>
          </label>
        </div>

        <div id="dev-wrap" class="field-row dev-wrap">
          <label class="field">
            <span>ไมโครโฟน</span>
            <select id="d-mic"><option value="">ค่าเริ่มต้นของระบบ</option></select>
          </label>
          <label class="field" id="d-sys-field" hidden>
            <span>อุปกรณ์เสียงในเครื่อง</span>
            <select id="d-sys"><option value="">— เลือกอุปกรณ์ —</option></select>
          </label>
        </div>
        <p id="dev-note" class="hint"></p>

        <div class="checks">
          <label id="c-mic-row" hidden><input id="c-mic" type="checkbox" checked> อัดไมโครโฟนของฉันด้วย</label>
          <label><input id="c-live" type="checkbox" checked> แสดงข้อความสดระหว่างประชุม</label>
        </div>
        <div id="rec-idle">
          <p id="rec-hint" class="hint"></p>
        </div>
        <div id="rec-live" hidden>
          <div class="rec-status">
            <span class="dot"></span>
            <span id="rec-time" class="rec-time">00:00</span>
          </div>
          <!-- คลื่นเสียงสด (.wave) ขับด้วย AnalyserNode — .meter เป็น fallback ตอน
               prefers-reduced-motion เท่านั้น (สลับกันด้วย CSS ไม่ใช่ JS ดู style.css) -->
          <div id="wave" class="wave" aria-hidden="true"></div>
          <div class="meter"><div id="meter-bar" class="meter-bar"></div></div>
          <p id="rec-warn" class="warn" hidden></p>
        </div>
      </div>

      <div class="card" data-cap="upload">
        <h3>📁 อัปโหลดไฟล์</h3>
        <p class="muted">ไฟล์ที่ Meet/Teams/Zoom อัดไว้ — mp3, m4a, wav, mp4, webm ฯลฯ</p>
        <div id="drop" class="drop">
          <svg class="drop-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 17v1.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V17"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>ลากไฟล์มาวางที่นี่</p>
          <p class="muted">หรือ</p>
          <button id="btn-pick" class="btn" type="button">เลือกไฟล์</button>
          <p class="drop-formats muted">mp3 · m4a · wav · mp4 · webm</p>
          <input id="f-file" type="file" accept="audio/*,video/*" hidden>
        </div>
      </div>
    </div>

    <!-- ตัวเลือกที่แทบไม่มีใครเปลี่ยน ยุบไว้ใน <details> พร้อมสรุปค่าปัจจุบันบนหัวข้อ
         (บนจอแคบห้าช่องนี้กินความสูงเกือบเต็มหน้าจอก่อนจะได้เห็นวิธีนำเสียงเข้าเสียอีก) -->
    <details class="adv">
      <summary>
        <span>ตัวเลือกเพิ่มเติม</span>
        <span id="adv-sum" class="adv-sum"></span>
      </summary>
    <div class="field-row">
      <label class="field field-sm">
        <span>ภาษาที่พูด</span>
        <select id="f-lang">
          <option value="th">ไทย</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="auto">ตรวจอัตโนมัติ</option>
        </select>
      </label>
      <label class="field field-sm">
        <span>รูปแบบสรุป</span>
        <select id="f-template"></select>
      </label>
      <label class="field field-sm">
        <span>ตัวถอดเสียง</span>
        <select id="f-stt"></select>
      </label>
    </div>
    <p id="stt-note" class="hint"></p>

    <div class="field-row diarize-row">
      <label class="check-inline">
        <input id="f-diarize" type="checkbox" checked>
        <span>แยกผู้พูด (ระบุว่าใครพูดประโยคไหน)</span>
      </label>
      <label class="field field-xs">
        <span>จำนวนคน</span>
        <select id="f-speakers">
          <option value="0">ให้ระบบเดา</option>
          <option value="2">2 คน</option>
          <option value="3">3 คน</option>
          <option value="4">4 คน</option>
          <option value="5">5 คน</option>
          <option value="6">6 คน</option>
          <option value="8">8 คน</option>
        </select>
      </label>
      <p id="diarize-note" class="hint" hidden></p>
    </div>
    </details>

    <!-- แถบควบคุมลอยด้านล่าง (floating bottom control bar) — position:fixed ใน CSS
         จึงวางไว้นอก .cards ก็ได้ สลับเนื้อหาไปตามสถานะเดียวกับ #rec-idle/#rec-live -->
    <div id="floatbar-idle" class="floatbar">
      <button id="btn-rec" class="fab-pill fab-rec" type="button">⏺ เริ่มอัด</button>
    </div>
    <div id="floatbar-live" class="floatbar" hidden>
      <button id="btn-mute" class="fab-pill" type="button" aria-pressed="false">🎙️ ปิดไมค์</button>
      <button id="btn-stop" class="fab-pill fab-stop" type="button">⏹ หยุดอัดแล้วสรุป</button>
    </div>

    <div id="live-wrap" class="live-wrap" hidden>
      <div class="section-head">
        <h3>📝 ข้อความสด</h3>
        <span id="live-status" class="live-badge"></span>
      </div>
      <div id="live-text" class="live-text"></div>
    </div>
  </div>
</template>

<!-- ---------- หน้าจอ: รายละเอียดการประชุม ---------- -->
<template id="tpl-help">
  <div class="help">
    <!-- ปุ่มนี้โผล่เฉพาะตอนเปิดคู่มือจากหน้าเข้าสู่ระบบ (body.auth-only) — ของเดิมกด ? จาก
         หน้านั้นแล้วแผงถูกแทนด้วยคู่มือทั้งแผง ไม่เหลืออะไรให้กดกลับเลย ต้องรีโหลดเอง
         (วัดจริงบนเบราว์เซอร์ก่อนแก้: ในแผงเหลือแต่ลิงก์สารบัญ 7 อัน) -->
    <button id="help-back" class="btn help-back" type="button">‹ กลับไปหน้าเข้าสู่ระบบ</button>

    <header class="help-hero">
      <h2>คู่มือการใช้งาน <span class="help-brand">meeting_ai</span></h2>
      <p class="help-lead">
        บันทึก ถอดเสียง และสรุปการประชุมด้วย AI — คู่มือสำหรับผู้ใช้งานทั่วไปและแอดมินของทีม
      </p>
    </header>

    <!-- ---------- 1 ---------- -->
    <section id="help-start" class="help-sec">
      <h3><span class="help-n">1</span>เริ่มต้นใช้งาน</h3>

      <figure class="help-fig">
        <div class="help-mock help-mock-bar">
          <span class="help-mock-brand">🎙️ meeting_ai</span>
          <span class="help-mock-sp"></span>
          <span class="btn btn-icon">?</span>
          <span class="btn btn-primary">+ ประชุมใหม่</span>
        </div>
        <figcaption>แถบบนสุด — ปุ่ม <b>?</b> คือคู่มือเล่มนี้ (บนมือถือแถบนี้อยู่ที่<b>หน้าแรก</b> หน้าอื่นสลับไปใช้แถบล่างแทน ดูหัวข้อ 13)</figcaption>
      </figure>

      <h4>1.1 เข้าใช้งาน</h4>
      <ol class="help-steps">
        <li>เปิดเว็บ meeting_ai ที่ทีมของคุณใช้</li>
        <li>
          ถ้าเจอหน้า <b>เข้าสู่ระบบ</b> ให้ใส่อีเมลกับรหัสผ่าน · ยังไม่มีบัญชี กด
          <span class="help-k">สมัครสมาชิก</span> แล้วใส่ <b>รหัสเชิญ</b> ที่ขอจากแอดมินของทีม
        </li>
        <li>คนแรกของระบบไม่ต้องใช้รหัสเชิญ — บัญชีแรกเป็นแอดมินและเชิญคนอื่นได้เอง</li>
        <li>บางการติดตั้งไม่มีหน้าเข้าสู่ระบบเลย (ใช้คนเดียวบนเครื่องตัวเอง) เข้าแล้วใช้ได้ทันที</li>
      </ol>

      <h4>1.2 หน้าจอหลัก</h4>
      <dl class="help-dl">
        <dt>แถบบนสุด</dt>
        <dd>ชื่อระบบ · สถิติรวม · ปุ่ม <b>?</b> คู่มือ · ปุ่ม <b>+ ประชุมใหม่</b> · ปุ่มบัญชีของคุณ</dd>
        <dt>คอลัมน์ซ้าย</dt>
        <dd>ช่องค้นหา · งานที่กำลังประมวลผล · สถานะเครื่องประมวลผล · รายการประชุมทั้งหมด</dd>
        <dt>พื้นที่ขวา</dt>
        <dd>ฟอร์มสร้างการประชุม หรือรายละเอียดของการประชุมที่เลือกอยู่</dd>
      </dl>

      <p class="help-tip">
        ช่องค้นหาหาในทั้ง <b>ชื่อ สรุป และบทถอดเสียง</b> — พิมพ์คำที่จำได้ว่ามีคนพูดก็เจอการประชุมนั้น
      </p>
    </section>

    <!-- ---------- 2 ---------- -->
    <section id="help-new" class="help-sec">
      <h3><span class="help-n">2</span>สร้างการประชุมใหม่</h3>

      <ol class="help-steps">
        <li>กด <span class="help-k">+ ประชุมใหม่</span> มุมขวาบน</li>
        <li>ตั้ง <b>ชื่อการประชุม</b> — ช่องนี้บังคับ</li>
        <li>เลือกว่าจะเอาเสียงเข้ามาแบบไหน หนึ่งในสามวิธีข้างล่าง</li>
        <li>ถ้าต้องการ เปิด <span class="help-k">ตัวเลือกเพิ่มเติม</span> ปรับภาษาและการแยกผู้พูดก่อนเริ่ม</li>
      </ol>

      <dl class="help-dl">
        <dt>ส่งบอท</dt>
        <dd>ใส่ลิงก์ห้องประชุม แล้วให้บอทเข้าไปนั่งอัดแทน — ไม่ต้องเปิดเครื่องทิ้งไว้ สั่งจากมือถือก็ได้</dd>
        <dt>อัดสด</dt>
        <dd>อัดจากเครื่องนี้เดี๋ยวนี้ — เหมาะกับประชุมในห้อง หรือเวลาที่บอทเข้าห้องไม่ได้</dd>
        <dt>อัปโหลดไฟล์</dt>
        <dd>มีไฟล์เสียงอยู่แล้ว ลากมาวางได้เลย</dd>
      </dl>

      <h4>2.1 ตัวเลือกเพิ่มเติม</h4>
      <table class="help-table">
        <thead><tr><th>ตัวเลือก</th><th>ค่าเริ่มต้น</th><th>เปลี่ยนเมื่อไหร่</th></tr></thead>
        <tbody>
          <tr><td>ภาษาที่พูด</td><td>ไทย</td><td>เลือกให้ตรงกับที่พูดจริง — <b>ไทย · English · 日本語 · 中文</b> หรือ “ตรวจอัตโนมัติ” ถ้าพูดปนกันหลายภาษา</td></tr>
          <tr><td>รูปแบบสรุป</td><td>แม่แบบมาตรฐาน</td><td>อยากได้สรุปคนละทรง เช่น เน้นมติที่ประชุมหรือเน้นงานที่ต้องทำ</td></tr>
          <tr><td>ตัวถอดเสียง</td><td>ตัวที่เครื่องประมวลผลมี</td><td>แทบไม่ต้องแตะ — เปลี่ยนเมื่อต้องการความเร็วหรือความแม่นต่างจากเดิม</td></tr>
          <tr><td>แยกผู้พูด</td><td>เปิด</td><td>ปิดได้ถ้าพูดคนเดียว จะเร็วขึ้น</td></tr>
          <tr><td>จำนวนคน</td><td>ให้ระบบเดา</td><td>ระบุไปเลยถ้ารู้จำนวนแน่นอน ผลจะแม่นกว่า</td></tr>
        </tbody>
      </table>

      <p class="help-tip">
        ตั้งชื่อที่ <b>ค้นเจอทีหลัง</b> — “ประชุม” เฉย ๆ จะหายไปในกองเมื่อมีสักสิบรายการ
      </p>
    </section>

    <!-- ---------- 3 ---------- -->
    <section id="help-rec" class="help-sec">
      <h3><span class="help-n">3</span>อัดสดจากเบราว์เซอร์</h3>

      <table class="help-table">
        <thead><tr><th>โหมด</th><th>เหมาะกับ</th><th>ต้องเตรียมอะไร</th><th>แยกสองฝั่งได้ไหม</th></tr></thead>
        <tbody>
          <tr>
            <td><b>🎙️ ไมค์เดียว</b></td>
            <td>ประชุมในห้อง · เปิดลำโพงคุยผ่านมือถือ</td>
            <td>ไม่ต้องเตรียมอะไร กดอัดได้เลย</td>
            <td>ไม่ได้ — ทุกเสียงรวมแทร็กเดียว</td>
          </tr>
          <tr>
            <td><b>🎧 ไมค์ + เสียงในเครื่อง</b></td>
            <td>ประชุมออนไลน์ที่อยากรู้ว่าใครพูดประโยคไหน</td>
            <td><b>อุปกรณ์วนเสียงกลับ</b> (Stereo Mix หรือ VB-CABLE บน Windows · BlackHole บน macOS) และต้องตั้งเสียงออกของระบบให้วิ่งเข้าอุปกรณ์นั้น</td>
            <td>ได้</td>
          </tr>
          <tr>
            <td><b>🖥️ แชร์แท็บ</b></td>
            <td>ประชุมที่เปิดอยู่ในแท็บเบราว์เซอร์</td>
            <td>กดแชร์หน้าจอทุกครั้ง และติ๊ก “แชร์เสียงแท็บ”</td>
            <td>ได้ · เสียงอีกฝ่ายคมที่สุด</td>
          </tr>
        </tbody>
      </table>

      <ol class="help-steps">
        <li>เลือกโหมด แล้วเลือกไมโครโฟน (และอุปกรณ์เสียงในเครื่อง ถ้าใช้โหมดนั้น)</li>
        <li>กด <span class="help-k">⏺ เริ่มอัด</span> ที่แถบล่างจอ</li>
        <li>ดูว่า <b>คลื่นเสียงขยับ</b> — ถ้านิ่งสนิทแปลว่าไม่มีเสียงเข้าจริง ๆ</li>
        <li>ระหว่างอัดกด <span class="help-k">🎙️ ปิดไมค์</span> ชั่วคราวได้</li>
        <li>จบแล้วกด <span class="help-k">⏹ หยุดอัดแล้วสรุป</span> — ระบบส่งเข้าคิวประมวลผลให้เอง</li>
      </ol>

      <figure class="help-fig">
        <p class="warn">ไม่ได้ยินเสียงจาก “เสียงในเครื่อง” — ตรวจว่าตั้งเสียงออกของระบบไปที่อุปกรณ์นั้นแล้วหรือยัง</p>
        <figcaption>
          ถ้ามีแทร็กไหนเงียบ แถบสีส้มแบบนี้จะขึ้นภายใน <b>6 วินาที</b> พร้อมชื่ออุปกรณ์ที่เงียบ
          — แก้แล้วอัดใหม่ได้เลย ไม่ต้องรอจนถอดเสียงเสร็จถึงจะรู้
        </figcaption>
      </figure>

      <p class="help-note">
        <b>อย่าปิดแท็บหรือรีเฟรชระหว่างอัด</b> — เสียงที่อัดไว้อยู่ในเบราว์เซอร์จนกว่าจะกดหยุด
        ถ้าหน้าถูกปิดก่อน เสียงช่วงนั้นหายไปเลย เบราว์เซอร์จะเตือนก่อนปิดให้ชั้นหนึ่ง
      </p>
    </section>

    <!-- ---------- 4 ---------- -->
    <section id="help-bot" class="help-sec">
      <h3><span class="help-n">4</span>ส่งบอทเข้าห้องประชุม</h3>

      <ol class="help-steps">
        <li>วาง <b>ลิงก์ห้องประชุม</b> — ระบบบอกให้เองว่าตรวจเจอว่าเป็นห้องของบริการไหน</li>
        <li>ตั้งชื่อบอทที่คนในห้องจะเห็น (ค่าเริ่มต้น <b>AI Notetaker</b>)</li>
        <li>ถ้าเป็นห้อง Zoom จะมีช่อง <b>รหัสเข้าห้อง</b> โผล่มา — ใส่ไว้ดีกว่า</li>
        <li>เลือกว่า <b>อยู่ในห้องไม่เกิน</b> นานแค่ไหน (มีให้เลือกตั้งแต่ 30 นาที ค่าเริ่มต้น 2 ชั่วโมง)</li>
        <li>กด <span class="help-k">ส่งบอทเข้าห้อง</span></li>
      </ol>

      <table class="help-table">
        <thead><tr><th>บริการ</th><th>บอทเข้าได้ไหม</th></tr></thead>
        <tbody>
          <tr><td>Google Meet</td><td>ได้</td></tr>
          <tr><td>Microsoft Teams</td><td>ได้</td></tr>
          <tr><td>Zoom</td><td>Zoom ปิดกั้นบอทที่เข้าผ่านเบราว์เซอร์ตามนโยบายของเขา และโปรเจกต์นี้ตั้งใจไม่หลบเลี่ยง — ใช้ <b>อัดสด</b> หรือให้ Zoom อัดเองแล้ว <b>อัปโหลดไฟล์</b> แทน</td></tr>
        </tbody>
      </table>

      <p class="help-note">
        <b>เจ้าของห้องต้องกดรับบอทเข้าห้องเหมือนคนทั่วไป</b> — ถ้าไม่มีใครกดรับ บอทจะออกมาเอง
        พร้อมบอกเหตุผล บอกคนในห้องไว้ก่อนว่าจะมีชื่อนี้ขอเข้า
      </p>
      <p class="help-tip">
        ปุ่มส่งบอทกดไม่ได้ ให้อ่านข้อความใต้ปุ่ม — มันบอกตรง ๆ ว่าขาดอะไรบนเครื่องประมวลผล
        · ประชุมเลิกก่อนเวลา กด <span class="help-k">ให้บอทออกจากห้องแล้วสรุป</span> บนการ์ดงานได้ ไม่ต้องรอครบเวลา
      </p>
    </section>

    <!-- ---------- 5 ---------- -->
    <section id="help-upload" class="help-sec">
      <h3><span class="help-n">5</span>อัปโหลดไฟล์เสียง</h3>
      <ol class="help-steps">
        <li>เลือก <b>อัปโหลดไฟล์</b> แล้วลากไฟล์มาวางในกรอบ หรือกด <span class="help-k">เลือกไฟล์</span></li>
        <li>รองรับ <b>mp3 · m4a · wav · mp4 · webm</b> และฟอร์แมตเสียง/วิดีโอทั่วไป — ไฟล์วิดีโอระบบดึงเฉพาะเสียงออกมาให้</li>
        <li>อัปเสร็จแล้วงานเข้าคิวประมวลผลเหมือนการอัดสด</li>
      </ol>
      <p class="help-tip">
        เหมาะที่สุดกับไฟล์ที่ <b>Meet / Teams / Zoom อัดไว้เอง</b> — โดยเฉพาะห้อง Zoom ที่บอทเข้าไม่ได้
        ให้ Zoom อัดแล้วเอาไฟล์มาลงที่นี่
      </p>
    </section>

    <!-- ---------- 6 ---------- -->
    <section id="help-wait" class="help-sec">
      <h3><span class="help-n">6</span>ระหว่างที่ระบบประมวลผล</h3>
      <p>
        งานทุกชิ้นโผล่เป็นการ์ดในคอลัมน์ซ้าย พร้อมแถบความคืบหน้าและบอกว่ากำลังทำขั้นไหนอยู่
        ปิดหน้าเว็บไปทำอย่างอื่นได้ งานยังเดินต่อบนเครื่องประมวลผล
      </p>

      <figure class="help-fig">
        <div class="help-mock">
          <div class="job">
            <div class="jt">ประชุมทีม Product ประจำสัปดาห์</div>
            <div class="js">กำลังถอดเสียง…</div>
            <div class="bar"><div style="width:62%"></div></div>
          </div>
          <div class="job">
            <div class="jt">🤖 คุยกับลูกค้า — รอบแก้สัญญา</div>
            <div class="js">รอคิว<span class="job-stuck">รอคิวมา 12 นาที — ไม่มีเครื่องที่ทำงานส่งบอทได้</span></div>
            <div class="bar"><div style="width:2%"></div></div>
          </div>
        </div>
        <figcaption>
          การ์ดบนคือปกติ · การ์ดล่างค้างคิวเพราะไม่มีเครื่องไหนทำงานชนิดนั้นได้
          — การ์ดจะบอกเองว่าค้างมานานแค่ไหนและเพราะอะไร
        </figcaption>
      </figure>

      <p class="help-note">
        งานที่ <b>ไม่มีเครื่องไหนรับได้เลย</b> ระบบจะเลิกรอให้หลัง <b>30 นาที</b> แล้วขึ้นว่าล้มเหลว
        — แก้ที่เครื่องประมวลผลแล้วสั่งใหม่ได้ ไม่ต้องนั่งเฝ้าว่ามันจะขยับไหม
      </p>
      <p class="help-tip">
        ตอนอัดสด ติ๊ก <b>แสดงข้อความสดระหว่างประชุม</b> ไว้ จะเห็นข้อความทยอยขึ้นระหว่างที่ยังประชุมอยู่
      </p>
    </section>

    <!-- ---------- 7 ---------- -->
    <section id="help-read" class="help-sec">
      <h3><span class="help-n">7</span>อ่านผลลัพธ์ — สี่แท็บ</h3>
      <p>เปิดการประชุมจากรายการทางซ้าย เนื้อหาแบ่งเป็นสี่ส่วน:</p>

      <figure class="help-fig">
        <div class="help-mock">
          <div class="seg">
            <span class="seg-btn is-on">สรุป</span>
            <span class="seg-btn">สิ่งที่ต้องทำ</span>
            <span class="seg-btn">ถาม</span>
            <span class="seg-btn">บทถอดเสียง</span>
          </div>
        </div>
        <figcaption>บนจอแคบสี่ส่วนนี้เป็นแท็บให้เลือกทีละอัน · บนจอกว้างเห็นต่อกันลงมาทั้งหมด</figcaption>
      </figure>

      <dl class="help-dl">
        <dt>สรุป</dt>
        <dd>
          สรุปที่ AI เขียนให้ · กด <span class="help-k">แก้ไข</span> พิมพ์ทับเองได้ ·
          กด <span class="help-k">สรุปใหม่ด้วย AI</span> ถ้าอยากได้อีกสำนวน
        </dd>
        <dt>สิ่งที่ต้องทำ</dt>
        <dd>

          <b>ของที่ติ๊กแล้วไม่หาย</b>แม้สรุปจะถูกเขียนใหม่
        </dd>
        <dt>ถาม</dt>
        <dd>ถามเป็นประโยคเกี่ยวกับการประชุมนี้ — ดูหัวข้อ 8</dd>
        <dt>บทถอดเสียง</dt>
        <dd>
          ข้อความทั้งหมดพร้อมเวลาและชื่อผู้พูด · แก้ได้ ·
          <b>คลิกบรรทัดไหนก็ได้เพื่อกระโดดไปฟังเสียงตรงจุดนั้น</b>
        </dd>

        ส่วนโหมด <b>🎧 ไมค์ + เสียงในเครื่อง</b> รู้ตั้งแต่ต้นว่าใครเป็นใคร จึงได้ชื่อ <b>ฉัน</b> กับ <b>ผู้ร่วมประชุม</b> มาเลย
        · แตะชิปเพื่อเปลี่ยนเป็นชื่อจริง แล้วทั้งบทถอดเสียงจะเปลี่ยนตาม

      <ol class="help-steps">
        <li>เปิดส่วน <b>ถาม</b> ของการประชุมนั้น</li>
        <li>พิมพ์คำถามเป็นประโยค เช่น “ตกลงอะไรกันบ้าง” หรือ “ใครรับผิดชอบเรื่องงบ”</li>
        <li>กด <span class="help-k">ถาม</span> — คำถามและคำตอบถูกเก็บไว้กับการประชุมนั้น คนอื่นที่เปิดดูก็เห็น</li>

      <ul class="help-ul">
        <li>
          <b>🔒 เฉพาะฉัน / 👥 ทั้งทีม</b> <span class="help-badge">ต้องล็อกอิน</span>
          — ช่องข้างชื่อการประชุม กำหนดว่าคนอื่นในทีมเห็นไหม ค่าเริ่มต้นคือเฉพาะคุณ
        </li>
        <li>
          <b>🔗 แชร์</b> <span class="help-badge">ต้องล็อกอิน</span>
          — สร้างลิงก์ให้คนนอกทีมเปิดดูได้ ติ๊กได้ว่าจะให้แก้สรุป/บทถอดเสียงด้วยไหม
          · กด <span class="help-k">สร้างลิงก์ใหม่</span> เพื่อออกลิงก์เพิ่ม หรือ
          <span class="help-k">ยกเลิกทุกลิงก์</span> เพื่อปิดทั้งหมดพร้อมกัน
        </li>
        <li><b>⬇ ดาวน์โหลด</b> — เลือกฟอร์แมตจากช่องข้าง ๆ แล้วกด</li>
      </ul>
      <p class="help-note">
        <b>ใครถือลิงก์แชร์ก็เปิดได้</b> โดยไม่ต้องล็อกอิน — ส่งเฉพาะคนที่ตั้งใจ และยกเลิกเมื่อไม่ใช้แล้ว
        · คนที่เปิดจากลิงก์ต้องกดยืนยันรับลิงก์ก่อน เบราว์เซอร์จึงจะจำไว้ 7 วัน
      </p>
      <p class="help-tip">
        ลิงก์แชร์แบบอ่านอย่างเดียวใช้ส่วน “ถาม” ไม่ได้ เพราะการถามเรียก AI ซึ่งใช้โควตาของเจ้าของ
      </p>

    <!-- ---------- 11 ---------- -->
    <section id="help-devices" class="help-sec">
      <h3><span class="help-n">11</span>เครื่องประมวลผล</h3>
      <p>
        งานหนักทั้งหมด (ถอดเสียง แยกผู้พูด สรุป ส่งบอท) ทำบนเครื่องประมวลผล ไม่ใช่บนเบราว์เซอร์ของคุณ
        ชิปสถานะบอกให้ว่าตอนนี้รับงานได้ไหม:
      </p>

      <figure class="help-fig">
        <div class="help-mock help-mock-chips">
          <span class="m-chip" data-state="ok"><span class="m-chip-dot"></span><span>2 เครื่องพร้อม</span></span>
          <span class="m-chip" data-state="down"><span class="m-chip-dot"></span><span>ไม่มีเครื่องประมวลผลออนไลน์</span></span>

        </div>
        <figcaption>จุดเขียว = ปกติ · จุดส้ม = มีปัญหา และข้อความบนชิปบอกว่าเรื่องอะไร — แตะชิปเพื่อเปิดหน้าเครื่องประมวลผลดูรายละเอียด</figcaption>
      </figure>

      <ul class="help-ul">
        <li><b>“N เครื่องพร้อม”</b> — งานที่สั่งจะเริ่มทันทีที่ถึงคิว</li>
        <li><b>“ไม่มีเครื่องประมวลผลออนไลน์”</b> — งานจะค้างในคิวจนกว่าจะเปิดเครื่องประมวลผล</li>
        <li><b>“N เครื่องออนไลน์ · ไม่มีเครื่องรับงาน…”</b> — มีเครื่องอยู่แต่ทำงานชนิดที่คุณสั่งไม่ได้</li>
      </ul>

      <p class="help-note">
        หน้าเครื่องประมวลผลอาจขึ้นว่าโค้ดบนเครื่องนั้น <b>คนละรุ่น</b>กับเซิร์ฟเวอร์ — แปลว่าเครื่องนั้น
        รันโค้ดเก่ากว่า งานชนิดใหม่จะค้างคิว ต้องอัปเดตโค้ดบนเครื่องนั้นแล้วรีสตาร์ต
      </p>
    </section>

    <!-- ---------- 12 ---------- -->
    <section id="help-account" class="help-sec">
      <h3><span class="help-n">12</span>บัญชีและทีม <span class="help-badge">ต้องล็อกอิน</span></h3>
      <ul class="help-ul">
        <li>กดปุ่มบัญชี (ตัวอักษรแรกของชื่อคุณ) เพื่อเปิดเมนูบัญชี</li>
        <li><b>เชิญสมาชิก</b> — แอดมินเท่านั้น · ระบบออกรหัสเชิญและคัดลอกให้ทันที ส่งทางแชทได้เลย</li>
        <li><b>ออกจากระบบ</b> — อยู่ในเมนูเดียวกัน</li>
        <li>แอดมินเปิด/ปิด <b>การอัดสด</b> ของทั้งระบบได้จากเมนูนี้</li>
      </ul>
      <p class="help-note">
        การประชุมของคุณ <b>คนอื่นในทีมไม่เห็น</b> จนกว่าจะตั้งเป็น <b>👥 ทั้งทีม</b> เอง
      </p>
    </section>

    <!-- ---------- 13 ---------- -->
    <section id="help-mobile" class="help-sec">
      <h3><span class="help-n">13</span>ใช้งานบนมือถือ</h3>
      <ul class="help-ul">
        <li>เปิดผ่านเบราว์เซอร์มือถือได้เต็มรูปแบบ — หน้าจอปรับเองเป็นแบบทีละหน้า</li>
        <li>ติดตั้งเป็นแอปบนหน้าจอหลักได้: เมนูของเบราว์เซอร์ → <b>เพิ่มไปยังหน้าจอหลัก</b></li>
        <li>แถบล่างมีปุ่ม <b>‹</b> ย้อนกลับไปรายการ และปุ่ม <b>⋯</b> เปิดเมนูของการประชุมที่เปิดอยู่</li>
        <li>สั่ง <b>ส่งบอท</b> จากมือถือได้สบาย เพราะบอทรันบนเครื่องประมวลผล ไม่ใช่บนเครื่องคุณ</li>
      </ul>
      <p class="help-note">
        โหมด <b>🖥️ แชร์แท็บ</b> ไม่มีบนจอแคบ เพราะเบราว์เซอร์มือถือแชร์เสียงแท็บไม่ได้
        — บนมือถือใช้ <b>🎙️ ไมค์เดียว</b>
      </p>
    </section>

    <!-- ---------- 14 ---------- -->
    <section id="help-faq" class="help-sec">
      <h3><span class="help-n">14</span>คำถามที่พบบ่อย</h3>

      <details class="help-q">
        <summary>ขึ้นว่า “ถอดเสียงไม่ได้ข้อความเลย — ไฟล์อาจไม่มีเสียงพูด”</summary>
        <p>
          ไฟล์เงียบจริง ๆ · ถ้าอัดด้วยโหมด <b>🎧 ไมค์ + เสียงในเครื่อง</b> สาเหตุที่พบบ่อยที่สุดคือ
          ยังไม่ได้ตั้งเสียงออกของระบบให้วิ่งเข้าอุปกรณ์วนเสียงกลับ — ตั้งแล้วอัดใหม่
        </p>
      </details>

      <details class="help-q">
        <summary>งานค้างที่ “รอคิว” ไม่ขยับเลย</summary>
        <p>
          อ่านการ์ดงาน มันบอกเองว่าค้างมานานแค่ไหนและเพราะอะไร · ถ้าไม่มีเครื่องไหนทำงานชนิดนั้นได้
          ระบบจะยกเลิกให้หลัง <b>30 นาที</b> แล้วสั่งใหม่ได้
        </p>
      </details>

      <details class="help-q">
        <summary>กดส่งบอทไม่ได้ ปุ่มเป็นสีจาง</summary>
        <p>
          ข้อความใต้ปุ่มบอกว่าขาดอะไรบนเครื่องประมวลผล (เช่น Docker หรือ image ของบอท)
          — แก้ที่เครื่องนั้นแล้วปุ่มจะกดได้เอง ไม่ต้องรีโหลดหน้า
        </p>
      </details>

      <details class="help-q">
        <summary>ส่งบอทเข้าห้อง Zoom ไม่ได้</summary>
        <p>
          Zoom ปิดกั้นบอทที่เข้าผ่านเบราว์เซอร์ตามนโยบายของเขา และโปรเจกต์นี้ตั้งใจไม่หลบเลี่ยง
          — ใช้ <b>อัดสด</b> ระหว่างประชุม หรือให้ Zoom อัดเองแล้ว <b>อัปโหลดไฟล์</b> ทีหลัง
        </p>
      </details>

      <details class="help-q">
        <summary>หน้าเครื่องประมวลผลขึ้นว่าโค้ด “คนละรุ่น” กับเซิร์ฟเวอร์</summary>
        <p>เครื่องนั้นรันโค้ดเก่ากว่า งานชนิดใหม่จะค้างคิว — อัปเดตโค้ดบนเครื่องนั้นแล้วรีสตาร์ต</p>
      </details>

      <details class="help-q">
        <summary>เปิดการประชุมเก่าแล้วเสียงเล่นไม่ได้</summary>
        <p>ไฟล์เสียงอาจถูกย้ายที่เก็บหรือถูกลบไปแล้ว — ส่วนสรุปกับบทถอดเสียงยังอยู่ครบ</p>
      </details>

      <details class="help-q">
        <summary>สรุปไม่ตรงใจ อยากได้อีกแบบ</summary>
        <p>
          เปลี่ยน <b>รูปแบบสรุป</b> ในตัวเลือกเพิ่มเติม แล้วกด <b>สรุปใหม่ด้วย AI</b>
          · หรือกด <b>แก้ไข</b> พิมพ์ทับเองก็ได้ ของที่พิมพ์เองจะไม่ถูกเขียนทับจนกว่าจะสั่งสรุปใหม่
        </p>
      </details>

      <details class="help-q">
        <summary>คนในทีมมองไม่เห็นการประชุมที่ผมสร้าง</summary>
        <p>ค่าเริ่มต้นคือ <b>🔒 เฉพาะฉัน</b> — เปลี่ยนช่องข้างชื่อการประชุมเป็น <b>👥 ทั้งทีม</b></p>
      </details>

      <details class="help-q">
        <summary>สมัครสมาชิกไม่ได้ ระบบขอรหัสเชิญ</summary>
        <p>ขอรหัสจากแอดมินของทีม — แอดมินกด “เชิญสมาชิก” ในเมนูบัญชี ระบบคัดลอกรหัสให้ทันที</p>
      </details>

      <details class="help-q">
        <summary>อัดอยู่แล้วเผลอปิดแท็บ</summary>
        <p>
          เสียงช่วงที่ยังไม่ได้กดหยุดจะหายไป เพราะยังอยู่ในเบราว์เซอร์ ไม่ได้ขึ้นไปที่เซิร์ฟเวอร์
          — ครั้งหน้าถ้าเบราว์เซอร์ถามว่าจะออกจากหน้านี้จริงไหมระหว่างอัด ให้ตอบว่าไม่
        </p>
      </details>
    </section>

    <p class="help-foot">
      คู่มือนี้อยู่ในตัวระบบและอัปเดตไปพร้อมกับหน้าจอเสมอ · ส่งลิงก์ <b>/#help</b> ให้เพื่อนร่วมทีมได้ตรง ๆ
    </p>
  </div>
</template>

           aria-label="ตำแหน่งในไฟล์เสียง" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <span id="p-time" class="p-time">0:00</span>
    </div>
    <p id="p-error" class="hint" hidden></p>
    <audio id="d-audio" preload="metadata"></audio>

    <!-- จอแคบ: สรุปกับบทถอดเสียงยาวมากทั้งคู่ วางต่อกันแล้วต้องเลื่อนผ่านสรุปทั้งอันกว่าจะถึง
         บทถอดเสียง — แยกเป็นแท็บ (ดู setupDetailTabs ใน app.js) จอกว้างยังเห็นทั้งสองส่วนต่อกัน -->
    <div id="d-seg" class="seg" role="tablist" hidden>
      <button class="seg-btn is-on" type="button" role="tab" data-tab="summary">สรุป</button>
      <button class="seg-btn" type="button" role="tab" data-tab="actions">สิ่งที่ต้องทำ</button>
      <button class="seg-btn" type="button" role="tab" data-tab="ask">ถาม</button>
      <button class="seg-btn" type="button" role="tab" data-tab="transcript">บทถอดเสียง</button>
    </div>

    <div class="dtab" data-tab="summary">

    <div class="section-head">
      <div>
        <h3>สรุป</h3>
        <span id="d-ai-live" class="ai-live" hidden>กำลังสรุปด้วย AI<span class="cursor">▍</span></span>
      </div>
      <div>
        <select id="d-lang" class="mini-select" title="ภาษาของสรุป"></select>
        <button id="d-translate" class="btn btn-sm" type="button">แปล</button>
        <button id="d-resummarize" class="btn btn-sm" type="button">สรุปใหม่ด้วย AI</button>
        <button id="d-edit" class="btn btn-sm" type="button">แก้ไข</button>
        <button id="d-save" class="btn btn-sm btn-primary" type="button" hidden>บันทึก</button>
        <button id="d-cancel" class="btn btn-sm" type="button" hidden>ยกเลิก</button>
      </div>
    </div>
    <p id="d-summary-err" class="notice" hidden></p>
    <div id="d-summary" class="md"></div>
    <textarea id="d-editor" class="editor" hidden spellcheck="false"></textarea>

    </div>

    <div class="dtab" data-tab="actions">
    <div class="section-head">
      <h3>สิ่งที่ต้องทำ</h3>
    </div>
    <p class="hint">ติ๊กเมื่อทำเสร็จ · แตะชื่อผู้รับผิดชอบเพื่อแก้</p>
    <div id="d-actions" class="actions-list"></div>
    </div>

    <div class="dtab" data-tab="ask">
    <div class="section-head">
      <h3>ถามเกี่ยวกับการประชุมนี้</h3>
    </div>
    <p class="hint">ตอบจากสรุปของการประชุมนี้เท่านั้น ไม่ได้อ่านบทถอดเสียงทั้งฉบับ</p>
    <div class="ask-box">
      <textarea id="q-input" rows="2" maxlength="500"
                placeholder="เช่น ตกลงอะไรกันบ้าง / ใครรับผิดชอบเรื่องงบ"></textarea>
      <button id="q-send" class="btn btn-primary" type="button">ถาม</button>
    </div>
    <p id="q-note" class="hint" hidden></p>
    <div id="d-qa" class="qa-list"></div>
    </div>

    <div class="dtab" data-tab="transcript">
    <div class="section-head">
      <h3>บทถอดเสียง</h3>
      <div>
        <button id="t-edit" class="btn btn-sm" type="button">แก้ไข</button>
        <button id="t-save" class="btn btn-sm btn-primary" type="button" hidden>บันทึก</button>
        <button id="t-cancel" class="btn btn-sm" type="button" hidden>ยกเลิก</button>
      </div>
    </div>
    <p class="hint">คลิกบรรทัดไหนก็ได้เพื่อกระโดดไปฟังเสียงตรงจุดนั้น</p>
    <div id="d-transcript" class="transcript-list"></div>
    </div>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
